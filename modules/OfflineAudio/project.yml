name: EeveeOfflineAudio
options:
  deploymentTarget:
    iOS: "16.1"
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit.git
    exactVersion: 0.4.10
targets:
  EeveeOfflineAudio:
    type: framework
    platform: iOS
    sources:
      - path: OfflineViews.swift
      - path: Bridge.swift
      - path: ../../CustomApps/SonoraOffline/Core.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eeveespotify.offlineaudio
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: YouTubeKit
