name: Build Spotify original interface with local downloads
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'modules/OfflineAudio/**'
      - 'CustomApps/SonoraOffline/Core.swift'
      - 'modules/OfflineAudio/OfflineOnly.x.swift'
      - '.github/workflows/build-spotify-original-offline.yml'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 55
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'
      - name: Install tools
        run: |
          brew install make dpkg ldid xcodegen
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Test local audio logic
        working-directory: CustomApps/SonoraOffline
        run: swift test
      - name: Compile local audio framework
        working-directory: modules/OfflineAudio
        run: |
          xcodegen generate
          xcodebuild -project EeveeOfflineAudio.xcodeproj -scheme EeveeOfflineAudio -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee framework-build.log
          test -f build/Build/Products/Release-iphoneos/EeveeOfflineAudio.framework/EeveeOfflineAudio
      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive
      - name: Get Orion binary for link
        run: |
          curl -fL https://github.com/zbzxbg/es-build-tools/releases/download/v1.0.0/Orion.zip -o "$RUNNER_TEMP/Orion.zip"
          unzip -q "$RUNNER_TEMP/Orion.zip" -d "$RUNNER_TEMP/orion"
          find "$RUNNER_TEMP/orion" -name Orion.framework -not -path '*__MACOSX*' -type d | head -1
      - name: Compile only the download-button hook
        run: |
          set -o pipefail
          THEOS_PACKAGE_SCHEME=rootless make -f modules/OfflineAudio/Makefile package FINALPACKAGE=1 2>&1 | tee tweak-build.log
          find packages -name 'com.eevee.spotify_*.deb' -print -quit | grep .
      - name: Reuse earlier Spotify IPA
        uses: actions/download-artifact@v4
        with:
          name: EeveeSpotify-IPA-orion-nopatch
          path: base-ipa
          repository: ${{ github.repository }}
          run-id: 41000900722
          github-token: ${{ github.token }}
      - name: Assemble Spotify IPA with the new engine
        run: |
          set -euo pipefail
          BASE=$(find base-ipa -name '*.ipa' -print -quit)
          test -n "$BASE"
          mkdir -p "$RUNNER_TEMP/deb" "$RUNNER_TEMP/spotify"
          DEB=$(find packages -name 'com.eevee.spotify_*.deb' -print -quit)
          dpkg-deb -x "$DEB" "$RUNNER_TEMP/deb"
          unzip -q "$BASE" -d "$RUNNER_TEMP/spotify"
          APP="$RUNNER_TEMP/spotify/Payload/Spotify.app"
          DYLIB=$(find "$RUNNER_TEMP/deb" -name EeveeSpotify.dylib -print -quit)
          test -f "$DYLIB"
          cp "$DYLIB" "$APP/Frameworks/EeveeSpotify.dylib"
          # The older IPA contains Eevee's visual code; replace its dylib with a
          # minimal hook and restore Spotify's native compatibility appearance.
          plutil -replace UIDesignRequiresCompatibility -bool YES "$APP/Info.plist"
          plutil -remove CFBundleIcons.CFBundleAlternateIcons "$APP/Info.plist" 2>/dev/null || true
          rm -rf "$APP/PlugIns/OpenSpotifySafariExtension.appex"
          cp -R modules/OfflineAudio/build/Build/Products/Release-iphoneos/EeveeOfflineAudio.framework "$APP/Frameworks/"
          find modules/OfflineAudio/build/Build/Products/Release-iphoneos -maxdepth 1 -name 'YouTubeKit*.bundle' -exec cp -R {} "$APP/" \;
          test -f "$APP/Frameworks/EeveeOfflineAudio.framework/EeveeOfflineAudio"
          lipo "$APP/Frameworks/EeveeOfflineAudio.framework/EeveeOfflineAudio" -verify_arch arm64
          ldid -S "$APP/Frameworks/EeveeOfflineAudio.framework/EeveeOfflineAudio"
          ldid -S "$APP/Frameworks/EeveeSpotify.dylib"
          # Keep the original executable entitlements when resealing the modified app.
          ldid -e "$APP/Spotify" > "$RUNNER_TEMP/entitlements.plist" 2>/dev/null || true
          if test -s "$RUNNER_TEMP/entitlements.plist"; then
            ldid -S"$RUNNER_TEMP/entitlements.plist" "$APP/Spotify"
          else
            ldid -S "$APP/Spotify"
          fi
          mkdir -p Outputs
          (cd "$RUNNER_TEMP/spotify" && zip -qry "$GITHUB_WORKSPACE/Outputs/Spotify-Original-Offline.ipa" Payload)
          unzip -t Outputs/Spotify-Original-Offline.ipa | tail -1
          unzip -l Outputs/Spotify-Original-Offline.ipa | grep 'Spotify.app/Frameworks/EeveeOfflineAudio.framework/EeveeOfflineAudio'
      - uses: actions/upload-artifact@v4
        with:
          name: Spotify-Original-Offline-IPA
          path: Outputs/Spotify-Original-Offline.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: spotify-offline-build-logs
          path: |
            modules/OfflineAudio/framework-build.log
            tweak-build.log
          if-no-files-found: ignore
