name: Sonora
options:
  bundleIdPrefix: com.chxcorrolp
  deploymentTarget:
    iOS: "16.1"
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit.git
    exactVersion: 0.4.10
targets:
  Sonora:
    type: application
    platform: iOS
    deploymentTarget: "16.1"
    sources:
      - path: App.swift
      - path: Core.swift
      - path: Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sonora
        CFBundleURLTypes:
          - CFBundleURLSchemes: [sonora]
            CFBundleURLName: com.chxcorrolp.sonoraoffline
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chxcorrolp.sonoraoffline
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: YouTubeKit
    scheme:
      gatherCoverageData: false
