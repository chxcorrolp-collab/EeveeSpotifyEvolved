name: Build Sonora for iPhone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CustomApps/SonoraOffline/**'
      - '.github/workflows/build-sonora.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: CustomApps/SonoraOffline
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1.1'
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test core
        run: swift test
      - name: Generate icon and project
        run: |
          swift GenerateIcon.swift
          xcodegen generate
      - name: Build iPhone app
        run: |
          set -o pipefail
          xcodebuild -project Sonora.xcodeproj -scheme Sonora -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log
      - name: Package and verify IPA
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/Sonora.app
          test -f "$APP/Sonora"
          plutil -lint "$APP/Info.plist"
          lipo "$APP/Sonora" -verify_arch arm64
          mkdir -p output/Payload
          cp -R "$APP" output/Payload/
          cd output
          zip -qry Sonora-1.0.0.ipa Payload
          unzip -t Sonora-1.0.0.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: Sonora-1.0.0-IPA
          path: CustomApps/SonoraOffline/output/Sonora-1.0.0.ipa
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Sonora-build-log
          path: CustomApps/SonoraOffline/build.log
          if-no-files-found: ignore
